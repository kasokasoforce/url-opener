name: Stage same-origin Worker UI bridge

on:
  push:
    branches:
      - feature/same-origin-worker-ui
    paths:
      - .github/workflows/stage-same-origin-bridge.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/same-origin-worker-ui
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Patch GitHub Pages bridge
        shell: python
        run: |
          from pathlib import Path

          bridge_template = '''<script>
          (() => {{
            const PAGES_ORIGIN='https://kasokasoforce.github.io';
            const WORKER_ORIGIN='https://raw1001-manual-intake.kasokasoforce.workers.dev';
            const STORAGE_ENDPOINT='raw1001CollectorEndpoint';
            const STORAGE_TOKEN='raw1001CollectorToken';
            const MIGRATION_PREFIX='raw1001-worker-migrate:';
            const targetPath='{target}';

            if(location.origin===PAGES_ORIGIN){{
              const token=localStorage.getItem(STORAGE_TOKEN)||'';
              if(token){{
                try{{window.name=MIGRATION_PREFIX+btoa(JSON.stringify({{token}}));}}catch{{}}
              }}
              location.replace(WORKER_ORIGIN+targetPath+location.search+location.hash);
              return;
            }}

            if(location.origin===WORKER_ORIGIN&&window.name.startsWith(MIGRATION_PREFIX)){{
              try{{
                const data=JSON.parse(atob(window.name.slice(MIGRATION_PREFIX.length)));
                if(typeof data.token==='string'&&data.token) localStorage.setItem(STORAGE_TOKEN,data.token);
                localStorage.setItem(STORAGE_ENDPOINT,WORKER_ORIGIN+'/manual-intake');
              }}catch{{}}
              window.name='urlLauncher';
            }}
          }})();
          </script>
          '''

          for filename, target in [('index.html','/app/'),('reading.html','/app/reading.html')]:
              p=Path(filename)
              s=p.read_text()
              marker='</title>\n'
              assert marker in s
              assert 'raw1001-worker-migrate:' not in s
              bridge=bridge_template.format(target=target)
              p.write_text(s.replace(marker, marker+bridge, 1))
      - name: Parse inline JavaScript
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const file of ['index.html','reading.html']){
            const html=fs.readFileSync(file,'utf8');
            const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m=>m[1]);
            if(!scripts.length) throw new Error(`${file}: no inline script`);
            for(const source of scripts) new Function(source);
            if(!html.includes('raw1001-worker-migrate:')) throw new Error(`${file}: bridge missing`);
          }
          NODE
      - name: Commit staged implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html reading.html
          git rm .github/workflows/stage-same-origin-bridge.yml
          git commit -m 'Bridge GitHub Pages to same-origin Worker UI'
          git push origin HEAD:feature/same-origin-worker-ui
