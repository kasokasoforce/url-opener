name: Stage POST migration bridge

on:
  push:
    branches:
      - feature/same-origin-worker-ui
    paths:
      - .github/workflows/stage-post-migration-bridge.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/same-origin-worker-ui
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Replace window-name bridge with top-level POST migration
        shell: python
        run: |
          from pathlib import Path

          template = '''<script>\n(() => {{\n  const PAGES_ORIGIN='https://kasokasoforce.github.io';\n  const WORKER_ORIGIN='https://raw1001-manual-intake.kasokasoforce.workers.dev';\n  const STORAGE_TOKEN='raw1001CollectorToken';\n  const target='{target}';\n\n  if(location.origin!==PAGES_ORIGIN) return;\n  const token=localStorage.getItem(STORAGE_TOKEN)||'';\n  if(!token){{\n    const path=target==='reading'?'/app/reading.html':'/app/';\n    location.replace(WORKER_ORIGIN+path+location.search+location.hash);\n    return;\n  }}\n\n  const form=document.createElement('form');\n  form.method='POST';\n  form.action=WORKER_ORIGIN+'/app/migrate';\n  for(const [name,value] of [['token',token],['target',target],['hash',location.hash]]){{\n    const input=document.createElement('input');\n    input.type='hidden';\n    input.name=name;\n    input.value=value;\n    form.append(input);\n  }}\n  (document.body||document.documentElement).append(form);\n  form.submit();\n}})();\n</script>\n'''

          for filename, target in [('index.html','index'),('reading.html','reading')]:
              p=Path(filename)
              s=p.read_text()
              title_end=s.index('</title>\n')+len('</title>\n')
              style_start=s.index('<style>\n', title_end)
              old=s[title_end:style_start]
              assert 'raw1001-worker-migrate:' in old
              assert 'window.name' in old
              new=template.format(target=target)
              p.write_text(s[:title_end]+new+s[style_start:])
      - name: Parse inline JavaScript and verify token transport
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const file of ['index.html','reading.html']){
            const html=fs.readFileSync(file,'utf8');
            const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m=>m[1]);
            if(!scripts.length) throw new Error(`${file}: no inline scripts`);
            for(const source of scripts) new Function(source);
            if(!html.includes("form.action=WORKER_ORIGIN+'/app/migrate'")) throw new Error(`${file}: POST bridge missing`);
            if(html.includes('raw1001-worker-migrate:')) throw new Error(`${file}: old window.name migration remains`);
            if(html.includes("['token',token]" )===false) throw new Error(`${file}: token form field missing`);
          }
          NODE
      - name: Commit staged implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html reading.html
          git rm .github/workflows/stage-post-migration-bridge.yml
          git commit -m 'Migrate Android UI token with top-level POST'
          git push origin HEAD:feature/same-origin-worker-ui
