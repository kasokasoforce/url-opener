name: Patch Brave Worker fetch retry

on:
  push:
    branches:
      - fix/brave-worker-fetch-retry
    paths:
      - .github/workflows/patch-brave-worker-fetch-retry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/brave-worker-fetch-retry
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Patch browser retry behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          helper = r'''function workerFetchWithRetry(rawUrl,options={}){
            const attempt=async(retry)=>{
              const url=new URL(rawUrl);
              if(retry) url.searchParams.set('_retry',`${Date.now()}-${Math.random().toString(36).slice(2)}`);
              return fetch(url.href,{...options,cache:'no-store'});
            };
            return attempt(false).catch(error=>{
              const message=String(error?.message||error||'');
              if(!(error instanceof TypeError)&&!/Failed to fetch/i.test(message)) throw error;
              return attempt(true);
            });
          }
          '''

          reading = Path('reading.html')
          text = reading.read_text(encoding='utf-8')
          marker = "function connection(){\n"
          assert marker in text
          text = text.replace(marker, helper + marker, 1)
          text = text.replace(
              "const response=await fetch(`${base}/reading-list?status=unread&limit=100`,{",
              "const response=await workerFetchWithRetry(`${base}/reading-list?status=unread&limit=100`,{",
              1,
          )
          text = text.replace(
              "const response=await fetch(`${base}/reading-status`,{",
              "const response=await workerFetchWithRetry(`${base}/reading-status`,{",
              1,
          )
          reading.write_text(text, encoding='utf-8')

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          marker = "function requireConfig(){\n"
          assert marker in text
          text = text.replace(marker, helper + marker, 1)
          text = text.replace(
              "const response=await fetch(endpoint.href,{\n      method:'POST',",
              "const response=await workerFetchWithRetry(endpoint.href,{\n      method:'POST',",
              1,
          )
          index.write_text(text, encoding='utf-8')
          PY

      - name: Parse inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          for name in ('index.html','reading.html'):
              text=Path(name).read_text(encoding='utf-8')
              scripts=re.findall(r'<script>(.*?)</script>',text,re.S)
              if not scripts:
                  raise SystemExit(f'no inline script in {name}')
              Path(f'/tmp/{name}.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/index.html.js
          node --check /tmp/reading.html.js

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-brave-worker-fetch-retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html reading.html .github/workflows/patch-brave-worker-fetch-retry.yml
          git commit -m 'Retry Worker fetches after browser network failure'
          git push origin HEAD:fix/brave-worker-fetch-retry
