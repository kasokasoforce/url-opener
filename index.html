<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>URL一括オープナー</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif;
    min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText;
  }
  main { width: min(760px, calc(100% - 28px)); padding: 18px 0 36px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { opacity: .8; margin: 0 0 14px; line-height: 1.55; }
  textarea {
    width: 100%; box-sizing: border-box; min-height: 280px; resize: vertical;
    padding: 14px; border-radius: 12px; border: 1px solid #8888; font: 14px/1.55 monospace;
  }
  .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  button {
    border: 0; border-radius: 10px; padding: 11px 15px; font-size: 15px; font-weight: 650;
    cursor: pointer;
  }
  #open { font-size: 16px; }
  #status { margin-top: 12px; min-height: 1.5em; font-size: 14px; opacity: .85; }
  .small { font-size: 13px; opacity: .65; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <h1>URL一括オープナー</h1>
  <p>1行に1URLを入れて「全部開く」を押します。初回だけ、このページのポップアップを許可してください。</p>

  <textarea id="urls" spellcheck="false" placeholder="https://example.com/1&#10;https://example.com/2&#10;https://example.com/3"></textarea>

  <div class="row">
    <button id="paste">貼り付け</button>
    <button id="open">全部開く</button>
    <button id="copy">コピー</button>
    <button id="clear">消去</button>
  </div>

  <div id="status"></div>
  <div class="small">http:// と https:// だけを対象にします。重複URLは1件にまとめます。</div>
</main>

<script>
const box = document.getElementById('urls');
const status = document.getElementById('status');

function getUrls() {
  const seen = new Set();
  const out = [];
  for (const line of box.value.split(/\r?\n/)) {
    const s = line.trim();
    if (!s) continue;
    try {
      const u = new URL(s);
      if (u.protocol !== 'http:' && u.protocol !== 'https:') continue;
      if (!seen.has(u.href)) {
        seen.add(u.href);
        out.push(u.href);
      }
    } catch {}
  }
  return out;
}

function updateCount() {
  const n = getUrls().length;
  status.textContent = n ? `${n}件のURL` : '';
}
box.addEventListener('input', updateCount);

document.getElementById('paste').addEventListener('click', async () => {
  try {
    const text = await navigator.clipboard.readText();
    box.value = text;
    updateCount();
  } catch {
    status.textContent = 'クリップボードを直接読めませんでした。入力欄を長押しして「貼り付け」してください。';
  }
});

document.getElementById('copy').addEventListener('click', async () => {
  const urls = getUrls();
  if (!urls.length) return;
  const text = urls.join('\n');
  try {
    await navigator.clipboard.writeText(text);
    status.textContent = `${urls.length}件をコピーしました`;
  } catch {
    box.focus();
    box.select();
    status.textContent = '選択しました。コピー操作をしてください。';
  }
});

document.getElementById('clear').addEventListener('click', () => {
  box.value = '';
  updateCount();
  box.focus();
});

document.getElementById('open').addEventListener('click', () => {
  const urls = getUrls();
  if (!urls.length) {
    status.textContent = '開くURLがありません';
    return;
  }

  let opened = 0;
  for (const url of urls) {
    const w = window.open(url, '_blank', 'noopener');
    if (w) opened++;
  }

  if (opened === urls.length) {
    status.textContent = `${opened}件を開きました`;
  } else {
    status.textContent = `${opened}/${urls.length}件を開きました。残りがブロックされた場合は、このページのポップアップを「常に許可」にしてください。`;
  }
});
</script>
</body>
</html>
