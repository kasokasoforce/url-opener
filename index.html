<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>URL一括オープナー</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif; background:Canvas; color:CanvasText; }
  main { width:min(760px,calc(100% - 28px)); margin:0 auto; padding:22px 0 40px; }
  h1 { font-size:22px; margin:0 0 8px; }
  p { margin:0 0 14px; line-height:1.55; opacity:.82; }
  textarea { width:100%; min-height:300px; resize:vertical; padding:14px; border-radius:12px; border:1px solid #8888; font:14px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace; background:Field; color:FieldText; }
  .row { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
  button { border:0; border-radius:10px; padding:11px 15px; font-size:15px; font-weight:650; cursor:pointer; }
  #open { font-size:16px; }
  #status { margin-top:12px; min-height:1.5em; font-size:14px; opacity:.86; }
  .small { margin-top:10px; font-size:13px; opacity:.65; line-height:1.5; }
</style>
</head>
<body>
<main>
  <h1>URL一括オープナー</h1>
  <p>ブックマークレットから受け取ったURLを、まとめて別タブで開きます。</p>
  <textarea id="urls" spellcheck="false" placeholder="ここにURLが自動で入ります。手動で1行1URLを貼り付けても使えます。"></textarea>
  <div class="row">
    <button id="open">全部開く</button>
    <button id="copy">コピー</button>
    <button id="paste">貼り付け</button>
    <button id="clear">消去</button>
  </div>
  <div id="status"></div>
  <div class="small">初回だけ、このページのポップアップを「常に許可」にしてください。http:// と https:// のURLだけを開きます。</div>
</main>
<script>
const box=document.getElementById('urls');
const status=document.getElementById('status');

function getUrls(){
  const seen=new Set(), out=[];
  for(const line of box.value.split(/\r?\n/)){
    const s=line.trim();
    if(!s) continue;
    try{
      const u=new URL(s);
      if(u.protocol!=='http:'&&u.protocol!=='https:') continue;
      if(!seen.has(u.href)){seen.add(u.href);out.push(u.href);}
    }catch{}
  }
  return out;
}
function updateCount(prefix=''){
  const n=getUrls().length;
  status.textContent=n?`${prefix}${n}件のURL`:'';
}
function importFromHash(){
  const h=location.hash;
  if(!h.startsWith('#urls=')) return;
  try{
    box.value=decodeURIComponent(h.slice(6));
    history.replaceState(null,'',location.pathname+location.search);
    updateCount('受け取り完了: ');
  }catch{
    status.textContent='URLの受け取りに失敗しました';
  }
}
box.addEventListener('input',()=>updateCount());

document.getElementById('open').addEventListener('click',()=>{
  const urls=getUrls();
  if(!urls.length){status.textContent='開くURLがありません';return;}
  let opened=0;
  for(const url of urls){
    const w=window.open(url,'_blank','noopener');
    if(w) opened++;
  }
  status.textContent=opened===urls.length
    ? `${opened}件を開きました`
    : `${opened}/${urls.length}件を開きました。残りが止まった場合は、このページのポップアップを「常に許可」にしてください。`;
});

document.getElementById('copy').addEventListener('click',async()=>{
  const urls=getUrls();
  if(!urls.length){status.textContent='コピーするURLがありません';return;}
  const text=urls.join('\n');
  try{
    await navigator.clipboard.writeText(text);
    status.textContent=`${urls.length}件をコピーしました`;
  }catch{
    box.focus(); box.select();
    status.textContent='URLを選択しました。コピー操作をしてください。';
  }
});

document.getElementById('paste').addEventListener('click',async()=>{
  try{
    box.value=await navigator.clipboard.readText();
    updateCount('貼り付け完了: ');
  }catch{
    box.focus();
    status.textContent='直接貼り付けできませんでした。入力欄を長押しして「貼り付け」を使ってください。';
  }
});

document.getElementById('clear').addEventListener('click',()=>{
  box.value=''; updateCount(); box.focus();
});

importFromHash();
</script>
</body>
</html>
